markdown_extensions:
    - toc:
        permalink: true
    - attr_list
    - md_in_html
    - pymdownx.highlight:
        anchor_linenums: true
    - pymdownx.superfences
    - pymdownx.tabbed:
        alternate_style: true
    - admonition
    - pymdownx.details
